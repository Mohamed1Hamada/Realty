<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="Segoe UI, Tahoma, sans-serif">
  <title>Realty Office — خريطة علاقات الجداول</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .head { fill: #1d4ed8; }
      .title { fill: #ffffff; font-size: 15px; font-weight: 700; }
      .pk { fill: #0f172a; font-size: 12.5px; font-weight: 700; }
      .fk { fill: #b91c1c; font-size: 12.5px; font-weight: 700; }
      .col { fill: #334155; font-size: 12.5px; }
      .rel { fill: #475569; stroke: #475569; stroke-width: 1.6; fill-opacity: 0; }
      .lbl { fill: #64748b; font-size: 11.5px; }
      .lblb { fill: #1d4ed8; font-size: 12px; font-weight: 700; }
      .h2 { fill: #0f172a; font-size: 20px; font-weight: 700; }
      .sub { fill: #64748b; font-size: 13px; }
    </style>
  </defs>

  <rect width="1240" height="930" fill="#f8fafc"/>

  <text x="620" y="32" text-anchor="middle" class="h2">Realty Office — خريطة علاقات الجداول</text>
  <text x="620" y="52" text-anchor="middle" class="sub">12 علاقة · Open Supabase → Database → Diagrams لمقارنتها بالرسم التلقائي</text>

  <!-- ============ العلاقات (الأسهم) ============ -->
  <!-- 1. auth.users -> profiles -->
  <path class="rel" d="M175 178 V 258" marker-end="url(#arrow)"/>
  <text x="185" y="222" class="lblb">1 : 1</text>

  <!-- 2. profiles -> properties -->
  <path class="rel" d="M290 328 H 440 V 218 H 516" marker-end="url(#arrow)"/>
  <text x="300" y="320" class="lblb">agent_id · created_by</text>

  <!-- 3. profiles -> clients -->
  <path class="rel" d="M290 288 H 340 V 96 H 1065 V 256" marker-end="url(#arrow)"/>
  <text x="600" y="88" class="lblb">assigned_to</text>

  <!-- 4. profiles -> leads -->
  <path class="rel" d="M290 398 H 450 V 518 H 516" marker-end="url(#arrow)"/>
  <text x="300" y="390" class="lblb">owner_id</text>

  <!-- 5. profiles -> contracts -->
  <path class="rel" d="M290 428 H 400 V 738 H 516" marker-end="url(#arrow)"/>
  <text x="296" y="452" class="lblb">agent_id</text>

  <!-- 6. profiles -> transactions -->
  <path class="rel" d="M175 438 V 900 H 1065 V 858" marker-end="url(#arrow)"/>
  <text x="470" y="892" class="lblb">created_by</text>

  <!-- 7. clients -> leads -->
  <path class="rel" d="M940 408 H 870 V 518 H 814" marker-end="url(#arrow)"/>
  <text x="878" y="400" class="lblb">client_id</text>

  <!-- 8. properties -> leads -->
  <path class="rel" d="M665 398 V 466" marker-end="url(#arrow)"/>
  <text x="675" y="436" class="lblb">property_id</text>

  <!-- 9. properties -> contracts -->
  <path class="rel" d="M810 328 H 895 V 728 H 814" marker-end="url(#arrow)"/>
  <text x="903" y="520" class="lblb">property_id</text>

  <!-- 10. clients -> contracts -->
  <path class="rel" d="M1065 448 V 648 H 900 V 808 H 814" marker-end="url(#arrow)"/>
  <text x="930" y="640" class="lblb">client_id</text>

  <!-- 11. contracts -> transactions -->
  <path class="rel" d="M810 848 H 936" marker-end="url(#arrow)"/>
  <text x="818" y="840" class="lblb">contract_id</text>

  <!-- ============ auth.users ============ -->
  <g>
    <rect x="60" y="78" width="230" height="100" class="box" rx="10"/>
    <rect x="60" y="78" width="230" height="30" class="head" rx="10"/>
    <rect x="60" y="98" width="230" height="10" class="head"/>
    <text x="175" y="99" text-anchor="middle" class="title">auth.users</text>
    <text x="175" y="132" text-anchor="middle" class="pk">id  uuid  (PK)</text>
    <text x="175" y="152" text-anchor="middle" class="col">email · encrypted_password</text>
    <text x="175" y="170" text-anchor="middle" class="lbl">(جدول جاهز من Supabase Auth)</text>
  </g>

  <!-- ============ profiles ============ -->
  <g>
    <rect x="60" y="258" width="230" height="180" class="box" rx="10"/>
    <rect x="60" y="258" width="230" height="30" class="head" rx="10"/>
    <rect x="60" y="278" width="230" height="10" class="head"/>
    <text x="175" y="279" text-anchor="middle" class="title">profiles · الموظفين</text>
    <text x="175" y="312" text-anchor="middle" class="pk">id  uuid  (PK = auth.users.id)</text>
    <text x="175" y="332" text-anchor="middle" class="col">email · full_name · phone</text>
    <text x="175" y="352" text-anchor="middle" class="col">role  (admin / staff)</text>
    <text x="175" y="372" text-anchor="middle" class="col">commission_rate  %</text>
    <text x="175" y="392" text-anchor="middle" class="col">is_active</text>
    <text x="175" y="420" text-anchor="middle" class="lbl">مركز الصلاحيات: كل جدول</text>
    <text x="175" y="434" text-anchor="middle" class="lbl">بيرجعله عن طريق موظف</text>
  </g>

  <!-- ============ properties ============ -->
  <g>
    <rect x="520" y="148" width="290" height="250" class="box" rx="10"/>
    <rect x="520" y="148" width="290" height="30" class="head" rx="10"/>
    <rect x="520" y="168" width="290" height="10" class="head"/>
    <text x="665" y="169" text-anchor="middle" class="title">properties · العقارات</text>
    <text x="665" y="202" text-anchor="middle" class="pk">id  uuid  (PK)</text>
    <text x="665" y="222" text-anchor="middle" class="col">ref_code (تلقائي PR-1001)</text>
    <text x="665" y="242" text-anchor="middle" class="col">title · purpose · type · status</text>
    <text x="665" y="262" text-anchor="middle" class="col">area_sqm · bedrooms · price</text>
    <text x="665" y="282" text-anchor="middle" class="col">governorate · district · images[]</text>
    <text x="665" y="302" text-anchor="middle" class="col">owner_name · owner_phone</text>
    <text x="665" y="326" text-anchor="middle" class="fk">agent_id  (FK → profiles)</text>
    <text x="665" y="346" text-anchor="middle" class="fk">created_by  (FK → profiles)</text>
    <text x="665" y="376" text-anchor="middle" class="lbl">ON DELETE SET NULL</text>
  </g>

  <!-- ============ clients ============ -->
  <g>
    <rect x="940" y="258" width="250" height="190" class="box" rx="10"/>
    <rect x="940" y="258" width="250" height="30" class="head" rx="10"/>
    <rect x="940" y="278" width="250" height="10" class="head"/>
    <text x="1065" y="279" text-anchor="middle" class="title">clients · العملاء</text>
    <text x="1065" y="312" text-anchor="middle" class="pk">id  uuid  (PK)</text>
    <text x="1065" y="332" text-anchor="middle" class="col">full_name · phone · email</text>
    <text x="1065" y="352" text-anchor="middle" class="col">kind · status · source</text>
    <text x="1065" y="372" text-anchor="middle" class="col">budget · notes</text>
    <text x="1065" y="396" text-anchor="middle" class="fk">assigned_to  (FK → profiles)</text>
    <text x="1065" y="424" text-anchor="middle" class="lbl">ON DELETE SET NULL</text>
  </g>

  <!-- ============ leads ============ -->
  <g>
    <rect x="520" y="468" width="290" height="160" class="box" rx="10"/>
    <rect x="520" y="468" width="290" height="30" class="head" rx="10"/>
    <rect x="520" y="488" width="290" height="10" class="head"/>
    <text x="665" y="489" text-anchor="middle" class="title">leads · المتابعات</text>
    <text x="665" y="522" text-anchor="middle" class="pk">id  uuid  (PK)</text>
    <text x="665" y="542" text-anchor="middle" class="fk">client_id  (FK → clients) CASCADE</text>
    <text x="665" y="562" text-anchor="middle" class="fk">property_id  (FK → properties)</text>
    <text x="665" y="582" text-anchor="middle" class="fk">owner_id  (FK → profiles)</text>
    <text x="665" y="602" text-anchor="middle" class="col">stage · next_followup_at · notes</text>
  </g>

  <!-- ============ contracts ============ -->
  <g>
    <rect x="520" y="688" width="290" height="200" class="box" rx="10"/>
    <rect x="520" y="688" width="290" height="30" class="head" rx="10"/>
    <rect x="520" y="708" width="290" height="10" class="head"/>
    <text x="665" y="709" text-anchor="middle" class="title">contracts · العقود</text>
    <text x="665" y="742" text-anchor="middle" class="pk">id  uuid  (PK)</text>
    <text x="665" y="762" text-anchor="middle" class="col">contract_no · type · status</text>
    <text x="665" y="782" text-anchor="middle" class="fk">property_id  (FK) RESTRICT</text>
    <text x="665" y="802" text-anchor="middle" class="fk">client_id  (FK) RESTRICT</text>
    <text x="665" y="822" text-anchor="middle" class="fk">agent_id  (FK → profiles)</text>
    <text x="665" y="842" text-anchor="middle" class="col">total_amount · commission_rate</text>
    <text x="665" y="862" text-anchor="middle" class="col">commission_amount · paid_amount</text>
    <text x="665" y="882" text-anchor="middle" class="lbl">sign_date · start_date · end_date</text>
  </g>

  <!-- ============ transactions ============ -->
  <g>
    <rect x="940" y="688" width="250" height="170" class="box" rx="10"/>
    <rect x="940" y="688" width="250" height="30" class="head" rx="10"/>
    <rect x="940" y="708" width="250" height="10" class="head"/>
    <text x="1065" y="709" text-anchor="middle" class="title">transactions · الحسابات</text>
    <text x="1065" y="742" text-anchor="middle" class="pk">id  uuid  (PK)</text>
    <text x="1065" y="762" text-anchor="middle" class="col">kind · category · amount</text>
    <text x="1065" y="782" text-anchor="middle" class="col">tx_date · description</text>
    <text x="1065" y="806" text-anchor="middle" class="fk">contract_id  (FK → contracts)</text>
    <text x="1065" y="826" text-anchor="middle" class="fk">created_by  (FK → profiles)</text>
    <text x="1065" y="848" text-anchor="middle" class="lbl">ON DELETE SET NULL</text>
  </g>

  <!-- ============ مفتاح الرسم ============ -->
  <g>
    <rect x="60" y="688" width="380" height="170" fill="#ffffff" stroke="#e2e8f0" rx="10"/>
    <text x="80" y="716" class="title" fill="#0f172a" font-size="14">مفتاح الرسم</text>
    <text x="80" y="742" class="pk">PK</text>
    <text x="120" y="742" class="col">المفتاح الأساسي</text>
    <text x="80" y="764" class="fk">FK</text>
    <text x="120" y="764" class="col">مفتاح أجنبي (علاقة بجدول تاني)</text>
    <text x="80" y="792" class="col" font-size="12">CASCADE  = الحذف ينتقل للسجلات المرتبطة</text>
    <text x="80" y="814" class="col" font-size="12">SET NULL = السجل يفضل والعمود يفضلّي</text>
    <text x="80" y="836" class="col" font-size="12">RESTRICT = الحذف مرفوض لو في ارتباط</text>
  </g>
</svg>
